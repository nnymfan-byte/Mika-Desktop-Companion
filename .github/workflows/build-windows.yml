name: Build Mika for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build standalone EXE
        run: |
          python -m pip install --upgrade pyinstaller
          pyinstaller --noconfirm --clean --onefile --windowed --name Mika companion.py
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/package | Out-Null
          Copy-Item dist/Mika.exe dist/package/Mika.exe
          Copy-Item README.md dist/package/README.md
          Copy-Item memory.json dist/package/memory.json
      - uses: actions/upload-artifact@v4
        with:
          name: Mika-Windows
          path: dist/package
